name: publish

# Tag a release and PyPI gets it. No API token lives in this repo -
# PyPI trusted publishing verifies the workflow itself.
#
# One-time setup, on https://pypi.org/manage/project/shalias/settings/publishing/:
#   owner            Ahmed-Bilal-Qazi
#   repository       shalias
#   workflow         publish.yml
#   environment      pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
