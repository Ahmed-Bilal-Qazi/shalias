[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shalias"
version = "3.0.0"
description = "Cross-platform script alias manager — run your scripts from anywhere using simple commands"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cli", "alias", "scripts", "terminal", "shell", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Ahmed-Bilal-Qazi/shalias"
Repository = "https://github.com/Ahmed-Bilal-Qazi/shalias"
"Bug Tracker" = "https://github.com/Ahmed-Bilal-Qazi/shalias/issues"

[project.scripts]
shalias = "shalias.cli:main"
