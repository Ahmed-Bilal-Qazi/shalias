[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shalias"
dynamic = ["version"]
description = "Turn any script, file or URL into a permanent terminal command - on Windows, macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Bilal Qazi" }]
keywords = [
    "cli", "alias", "scripts", "terminal", "shell", "automation",
    "windows", "doskey", "path", "launcher", "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/Ahmed-Bilal-Qazi/shalias"
Repository = "https://github.com/Ahmed-Bilal-Qazi/shalias"
"Bug Tracker" = "https://github.com/Ahmed-Bilal-Qazi/shalias/issues"

[project.scripts]
shalias = "shalias.cli:main"

# One source of truth for the version: shalias/constants.py.
[tool.hatch.version]
path = "shalias/constants.py"

[tool.hatch.build.targets.sdist]
include = ["shalias", "tests", "README.md", "CHANGELOG.md", "LICENSE.txt", "pytest.ini"]

[tool.hatch.build.targets.wheel]
packages = ["shalias"]
